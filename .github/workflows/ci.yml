name: CI

# Gate every PR regardless of base (a PR may target another feature branch rather
# than the trunk), and every push to the trunks. Every other branch is gated
# through its own PR (opened and then `synchronize`d), including a shared one that
# collects several.
on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  # Only `pull_request` runs share a group; every other trigger gets one of its own and
  # cancels nothing. `github.ref` tells PRs apart — `refs/pull/N/merge` is per-PR — but it
  # does NOT tell landings apart: every push to `dev` is `refs/heads/dev`, so a shared group
  # would make each landing cancel the run of the one before it. `build-test-lint` is a
  # required check, so that commit is left `cancelled` — "not verified", which on a trunk
  # looks exactly like verified. Landings are serialized today by "Require branches to be up
  # to date before merging" (on both trunks), which is why nothing has been cancelled yet;
  # this keeps the verdict from being lost silently the day that setting goes.
  # `cancel-in-progress: false` under a shared group is NOT the fix: it queues instead of
  # cancelling, and GitHub keeps one pending per group, so a third landing evicts the second.
  # The condition is "not a pull_request" rather than "== push" so `workflow_dispatch` — which
  # also runs on the trunks — is covered, and so a trigger added later is safe by default; it
  # also derives the trunk list from `on.push.branches` above instead of repeating it. The
  # suffix keys per *run*, not per SHA: one commit can produce two push events. The second
  # line reads as redundant while the group is unique, but it is the floor under the first —
  # a group expression fails silently, and an empty `run_id` would collapse the key back into
  # a shared one with the cancellation switched on.
  group: ci-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pin the formatter so a Homebrew stable bump can't silently change lint rules under
  # us (0.62 enabled wrapIfStatementBodies by default). Bump this deliberately, in step
  # with the Brewfile note and a local `brew upgrade swiftformat`.
  SWIFTFORMAT_VERSION: "0.62.1"
  # SHA-256 of that version's `swiftformat.zip` release asset — verified before the
  # binary runs, so a swapped/tampered asset fails the build. Update alongside the version.
  SWIFTFORMAT_SHA256: "7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a"

jobs:
  build-test-lint:
    runs-on: macos-15
    # The job normally finishes in ~3 minutes. A cap keeps a hang — e.g. a test that
    # blocks a runner's small worker pool on a subprocess — from burning the default
    # six hours before anyone notices it is stuck rather than slow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Swift 6 / Swift Testing)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install tooling
        run: brew install xcodegen swiftlint

      - name: Install SwiftFormat (pinned)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version

      - name: Format check
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint --strict

      - name: Test (headless core)
        run: swift test

      # Both configurations go through the same `make build-app` a developer runs (it
      # regenerates the Xcode project itself), so what CI proves green is exactly what
      # `make run` produces and there is no second copy of the build flags to keep in step.
      # Two invariants ride on those builds, neither of them visible to `swift test`, each
      # with its own assert step below:
      #   · Release and Debug must keep SEPARATE macOS identities — that lives in per-config
      #     build settings (project.yml `settings.configs`), not in code.
      #   · each bundle must come out validly SEALED — macOS refuses to *execute* an
      #     unsigned .app, which reads as a ~20s stall on first launch.
      # No signing flags are passed: the builds must exercise the `CODE_SIGN_IDENTITY: "-"`
      # project.yml declares, because that declaration is what can regress and a
      # command-line override would mask its removal. Ad-hoc signing needs no certificate,
      # team or keychain, so this job stays credential-free; the real Developer ID +
      # Hardened Runtime signature is a release-only path, verified in scripts/build-app.sh.
      - name: Build app (Release — shipping identity)
        run: make build-app CONFIG=Release

      - name: Build app (Debug — dev identity)
        run: make build-app CONFIG=Debug

      - name: Assert dev and release identities stay isolated
        run: bash scripts/assert-build-identities.sh

      # `!cancelled()` so a failure in the identity assert above does not skip this one: the
      # two invariants are orthogonal, and both should be reported in a single run rather than
      # costing a second CI cycle to surface the second after the first is fixed. Both builds
      # have run by here, so it never fires against a missing product on their account.
      - name: Assert both built apps are validly signed
        if: ${{ !cancelled() }}
        run: bash scripts/assert-build-signed.sh
