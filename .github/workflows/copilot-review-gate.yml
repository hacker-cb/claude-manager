# Makes a GitHub Copilot code review a hard, required merge gate.
#
# Copilot's review is advisory: it lands as a "Comment" review, counts toward no
# approval requirement, and emits no stable status check of its own — so with
# auto-merge on, a fast CI run merges the PR before Copilot has posted anything.
# The job below publishes a status check named "copilot-review-gate" that stays
# pending until Copilot has genuinely reviewed the PR.
#
# THE LOGIC LIVES IN THE ACTION, not here:
#   https://github.com/hacker-cb/action-copilot-review-gate
# This file is the thin wrapper carrying what a composite action cannot declare
# for itself — the trigger, the permissions, the concurrency group and the job's
# name. Everything else is an input with a working default; see that repository's
# README for the full list and for what the gate actually checks.
#
# It replaced a 370-line workflow vendored byte-for-byte from a gist. A fix now
# reaches every repository by moving one tag instead of a synchronising PR per
# repository — which is what let a Copilot review-format change break the gate in
# several projects at once.
#
# REQUIRED SETUP, both in the branch ruleset (neither is in this file):
#   1. "Automatically request Copilot code review" (review_on_push: true), or
#      nothing requests the first review and this waits for something that never
#      arrives.
#   2. "copilot-review-gate" (source: GitHub Actions) in the branch's REQUIRED
#      status checks — that is what actually blocks auto-merge.
# In this repository both are configured on `master` only; `dev` carries no
# ruleset, so the gate runs there but gates nothing.
#
# The job name below IS the status-check name the rulesets reference. Renaming it
# silently stops satisfying them, so leave it alone.

name: Copilot review gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

# `write` buys exactly one operation: adding Copilot back as a reviewer after it
# answered without reviewing. The job never checks out this repository's code,
# never comments and never merges. A PR from a fork gets a read-only token
# regardless, since the trigger is `pull_request` and not `pull_request_target`.
permissions:
  pull-requests: write

# A new push supersedes the previous wait for the same PR.
concurrency:
  group: copilot-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copilot-review-gate:
    name: copilot-review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: hacker-cb/action-copilot-review-gate@v1
